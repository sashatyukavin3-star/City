name: "Build CityForge Android"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"

permissions:
  contents: read

jobs:
  build:
    name: "Build APK"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Java 17"
        uses: "actions/setup-java@v5"
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: "android-actions/setup-android@v3"

      - name: "Install Android SDK packages"
        shell: "bash"
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: "Setup Godot 4.4.1"
        shell: "bash"
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: "Install Godot Android export templates"
        shell: "bash"
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          TEMP_DIR="$RUNNER_TEMP/godot-export-templates"

          rm -rf "$TEMP_DIR" "$TEMPLATE_DIR"
          mkdir -p "$TEMP_DIR" "$TEMPLATE_DIR"

          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export-templates.tpz" -O "$TEMP_DIR/templates.tpz"
          unzip -q "$TEMP_DIR/templates.tpz" -d "$TEMP_DIR/unpacked"

          DEBUG_TEMPLATE="$(find "$TEMP_DIR/unpacked" -type f -name "android_debug.apk" -print -quit)"
          RELEASE_TEMPLATE="$(find "$TEMP_DIR/unpacked" -type f -name "android_release.apk" -print -quit)"

          test -n "$DEBUG_TEMPLATE"
          test -n "$RELEASE_TEMPLATE"

          cp "$DEBUG_TEMPLATE" "$TEMPLATE_DIR/android_debug.apk"
          cp "$RELEASE_TEMPLATE" "$TEMPLATE_DIR/android_release.apk"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          ls -lh "$TEMPLATE_DIR"

      - name: "Validate Godot project"
        shell: "bash"
        run: |
          set -euo pipefail
          test -f "project.godot"
          test -f "export_presets.cfg"
          grep -n 'platform="Android"' "export_presets.cfg"
          godot --headless --path "." --editor --quit --verbose

      - name: "Export release APK"
        shell: "bash"
        run: |
          set -uo pipefail
          mkdir -p "build"
          godot --headless --path "." --verbose --export-release "Android" "build/CityForge.apk" 2>&1 | tee "export.log"
          EXIT_CODE=${PIPESTATUS[0]}
          cat "export.log"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Godot export failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: "Verify APK"
        shell: "bash"
        run: |
          set -euo pipefail
          test -s "build/CityForge.apk"
          file "build/CityForge.apk"
          ls -lh "build/CityForge.apk"

      - name: "Upload APK"
        uses: "actions/upload-artifact@v4"
        with:
          name: "cityforge-release-apk"
          path: "build/CityForge.apk"
          if-no-files-found: "error"
