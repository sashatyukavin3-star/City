name: Build CityForge Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Find and extract CityForge
        run: |
          set -e
          mkdir -p cityforge
          ZIP=$(find . -maxdepth 2 -type f -name "CityForge*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "CityForge ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP" -d cityforge

          PROJECT=$(find cityforge -name project.godot -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "project.godot not found inside ZIP"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Prepare Android export
        run: |
          set -e

          PROJECT_DIR=$(dirname "$PROJECT")
          cd "$PROJECT_DIR"

          mkdir -p .godot

          godot --headless \
            --editor \
            --quit \
            --path . \
            --verbose

      - name: Export APK
        run: |
          set -e

          PROJECT_DIR=$(dirname "$PROJECT")
          cd "$PROJECT_DIR"

          mkdir -p build

          godot --headless \
            --path . \
            --export-release "Android" \
            build/CityForge.apk

      - name: Verify APK
        run: |
          set -e
          test -f "$(dirname "$PROJECT")/build/CityForge.apk"
          ls -lh "$(dirname "$PROJECT")/build/CityForge.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cityforge-release-apk
          path: "**/build/CityForge.apk"
