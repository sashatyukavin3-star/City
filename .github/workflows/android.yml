name: "Build CityForge Android"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    name: "Build APK"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Godot ${{ env.GODOT_VERSION }}"
        shell: "bash"
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: "Install Godot export templates"
        shell: "bash"
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMP_DIR="$RUNNER_TEMP/godot-export-templates"

          rm -rf "$TEMP_DIR" "$TEMPLATE_DIR"
          mkdir -p "$TEMP_DIR" "$TEMPLATE_DIR"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O "$TEMP_DIR/templates.tpz"
          unzip -q "$TEMP_DIR/templates.tpz" -d "$TEMP_DIR/unpacked"

          # The .tpz packs everything under a "templates" folder; copy its
          # contents into the version-specific template directory Godot expects.
          cp -r "$TEMP_DIR/unpacked/templates/." "$TEMPLATE_DIR/"
          ls -lh "$TEMPLATE_DIR" | head -n 20

      - name: "Import project resources"
        shell: "bash"
        run: |
          set -euo pipefail
          test -f "project.godot"
          test -f "export_presets.cfg"
          grep -n 'platform="Android"' "export_presets.cfg"
          # First headless run imports assets and generates the .godot cache.
          godot --headless --path "." --import --verbose

      - name: "Export release APK"
        shell: "bash"
        run: |
          set -euo pipefail
          mkdir -p "build"
          set +e
          godot --headless --path "." --verbose --export-release "Android" "build/CityForge.apk" 2>&1 | tee "export.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ ! -s "build/CityForge.apk" ]; then
            echo "::error::APK was not produced (godot exit code ${EXIT_CODE})"
            exit 1
          fi

      - name: "Verify APK"
        shell: "bash"
        run: |
          set -euo pipefail
          test -s "build/CityForge.apk"
          file "build/CityForge.apk"
          ls -lh "build/CityForge.apk"

      - name: "Upload APK"
        uses: "actions/upload-artifact@v4"
        with:
          name: "cityforge-release-apk"
          path: "build/CityForge.apk"
          if-no-files-found: "error"
